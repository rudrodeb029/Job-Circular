# Integrated Workflow for Firebase Hosting, Firestore, and Android APK
name: Deploy and Build APK on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOB_CIRCULAR_75DBB }}'
          channelId: live
          projectId: job-circular-75dbb

      - name: Deploy Firestore Rules and Indexes
        run: |
          npm install -g firebase-tools
          cat <<EOF > service-account.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOB_CIRCULAR_75DBB }}
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          firebase deploy --only firestore --project job-circular-75dbb --non-interactive
          rm service-account.json


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Job-Circular-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
