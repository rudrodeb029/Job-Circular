# Workflow for automatic Firebase Hosting & Firestore deployment on push
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOB_CIRCULAR_75DBB }}'
          channelId: live
          projectId: job-circular-75dbb

      - name: Deploy Firestore Rules and Indexes
        run: |
          npm install -g firebase-tools
          cat <<EOF > service-account.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOB_CIRCULAR_75DBB }}
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          firebase deploy --only firestore --project job-circular-75dbb --non-interactive
          rm service-account.json
