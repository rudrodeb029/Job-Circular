name = "job-circular-proxy"
main = "edge-proxy.js"
compatibility_date = "2024-01-01"

# Secrets are stored as encrypted Wrangler secrets (not in source code)
# Set via: npx wrangler secret put WEBHOOK_SECRET
#          npx wrangler secret put HMAC_SECRET
#          npx wrangler secret put ONESIGNAL_REST_KEY
[vars]
# No secrets here — all moved to `wrangler secret put`

[[kv_namespaces]]
binding = "CACHE_KV"
id = "ea9b95e256ed4e46999d1a13dcc19edf"

[[d1_databases]]
binding = "EXAM_DB"
database_name = "exam-submissions-db"
database_id = "9877bfdd-ee74-4fb9-b7d5-c84a9247ee93"
migrations_dir = "migrations"

[[queues.producers]]
queue = "live-exam-queue"
binding = "EXAM_QUEUE"

[[queues.consumers]]
queue = "live-exam-queue"
max_batch_size = 50
max_batch_timeout = 5

[triggers]
crons = ["* * * * *"]
